name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unix:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cc: [gcc, clang]
        exclude:
          # gcc on macOS is an alias for clang
          - os: macos-latest
            cc: gcc
    steps:
      - uses: actions/checkout@v7
      - run: make CC=${{ matrix.cc }} all test
      - run: make CC=${{ matrix.cc }} bench

  sanitizers:
    name: ubuntu / clang / ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: >
          make CC=clang test
          CFLAGS="-std=c99 -Wall -Wextra -Wpedantic -Werror -O1 -g
          -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"

  mingw:
    name: windows / mingw gcc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: make all test
      - run: make bench

  msvc:
    name: windows / msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and run tests
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSDIR=%%i
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cl /nologo /W4 /std:c11 tests\test_argh.c /Fe:test_argh.exe || exit /b 1
          test_argh.exe

  # Temporary: macro prototype check (proto/ branch only)
  proto-msvc:
    name: proto / msvc ${{ matrix.pp }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        pp: ["traditional", "conforming"]
    steps:
      - uses: actions/checkout@v7
      - name: Build and run prototype
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSDIR=%%i
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          if "${{ matrix.pp }}"=="conforming" (set PP=/Zc:preprocessor) else (set PP=)
          cd proto
          echo === C11 %PP%
          cl /nologo /W4 /WX /std:c11 %PP% test_macros.c /Fe:m.exe || exit /b 1
          m.exe || exit /b 1
          echo === C++17 %PP%
          cl /nologo /W4 /WX /std:c++17 %PP% /TP test_macros.c /Fe:mp.exe || exit /b 1
          mp.exe || exit /b 1
          echo === wrong type must produce a diagnostic
          cl /nologo /W4 /std:c11 %PP% /c wrong_type.c > wrong.txt 2>&1
          type wrong.txt
          findstr /R /C:"warning C" /C:"error C" wrong.txt || (echo No diagnostic for wrong target type & exit /b 1)
