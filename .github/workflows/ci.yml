name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unix:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cc: [gcc, clang]
        exclude:
          # gcc on macOS is an alias for clang
          - os: macos-latest
            cc: gcc
    steps:
      - uses: actions/checkout@v4
      - run: make CC=${{ matrix.cc }} all test

  sanitizers:
    name: ubuntu / clang / ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >
          make CC=clang test
          CFLAGS="-std=c99 -Wall -Wextra -Wpedantic -Werror -O1 -g
          -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"

  mingw:
    name: windows / mingw gcc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: make all test

  msvc:
    name: windows / msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build and run tests
        shell: cmd
        run: |
          cl /nologo /W4 /std:c11 tests\test_argh.c /Fe:test_argh.exe || exit /b 1
          test_argh.exe
